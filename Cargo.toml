[workspace]
members = [
    "crates/agentbox-daemon",
    "crates/agentbox-shim",
    "crates/agentbox-cli",
    "crates/agentbox-policy",
    "crates/agentbox-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/EfeDurmaz16/agentbox"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
ulid = "1"
libc = "0.2"
sha2 = "0.10"
ed25519-dalek = "2.2"
