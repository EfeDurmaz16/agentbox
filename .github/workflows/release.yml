name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or candidate label to embed in archive names.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build and attest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build release binaries
        run: cargo build --locked --release --workspace

      - name: Package release archive and checksums
        env:
          AGENTBOX_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: scripts/package-release-artifacts.sh

      - name: Verify checksums
        run: |
          cd target/agentbox-release-artifacts
          shasum -a 256 -c SHA256SUMS

      - name: Attest archive provenance
        uses: actions/attest@v4
        with:
          subject-checksums: target/agentbox-release-artifacts/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentbox-release-${{ matrix.os }}
          path: target/agentbox-release-artifacts/*
          if-no-files-found: error
