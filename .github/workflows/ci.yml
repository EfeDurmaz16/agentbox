name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: CLI smoke
        run: |
          cargo run --locked -p agentbox-cli -- --help
          cargo run --locked -p agentbox-cli -- minipod-spec hermes --workspace .
          bash scripts/smoke-cli-contracts.sh
          bash scripts/smoke-remote-worker.sh

      - name: Live-test skip script syntax
        run: |
          bash -n scripts/smoke-cli-contracts.sh
          bash -n scripts/smoke-remote-worker.sh
          bash -n scripts/smoke-macos-minipod.sh
