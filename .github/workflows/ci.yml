name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: CLI smoke
        run: |
          cargo run --locked -p agentbox-cli -- --help
          cargo run --locked -p agentbox-daemon --bin agentbox-linux-runner -- --help
          cargo run --locked -p agentbox-cli -- minipod-spec hermes --workspace .
          bash scripts/smoke-cli-contracts.sh
          bash scripts/smoke-remote-worker.sh
          AGENTBOX_PODMAN_BRIDGE_CONTRACT_ONLY=1 bash scripts/smoke-podman-bridge.sh
          AGENTBOX_PODMAN_LIFECYCLE_CONTRACT_ONLY=1 bash scripts/smoke-podman-lifecycle.sh

      - name: Linux AgentPod conformance target
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/smoke-linux-agentpod-conformance.sh

      - name: Live-test skip script syntax
        run: |
          bash -n scripts/build-linux-shim.sh
          bash -n scripts/demo-autonomous-agent.sh
          bash -n scripts/demo-v0.2.sh
          bash -n scripts/install-agentbox-local.sh
          bash -n scripts/linux-isolation-benchmark.sh
          bash -n scripts/smoke-cli-contracts.sh
          bash -n scripts/smoke-install-upgrade-rollback.sh
          bash -n scripts/smoke-linux-agentpod-conformance.sh
          bash -n scripts/smoke-linux-native.sh
          bash -n scripts/smoke-remote-worker.sh
          bash -n scripts/smoke-macos-minipod.sh
          bash -n scripts/smoke-podman-bridge.sh
          bash -n scripts/smoke-podman-lifecycle.sh
          bash -n scripts/release-readiness.sh
